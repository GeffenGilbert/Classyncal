<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classyncal</title>
    <meta name="description" content="Turn a syllabus PDF into Google Calendar events and Google Tasks in a few clicks." />
    <script>
      // Runs before first paint so a returning dark-mode visitor never sees a
      // white flash.
      // Mirrored in /privacy and /terms, which are plain HTML outside the app.
      (function () {
        try {
          // Light is the default: dark is opt-in through the toggle, never inferred
          // from the OS. Only an explicit stored choice turns it on.
          var dark = localStorage.getItem("classyncal-theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* Storage blocked - fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
